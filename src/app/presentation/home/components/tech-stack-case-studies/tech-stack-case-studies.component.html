<section class="track" aria-labelledby="projects-title">
  <div class="track__container">
    <ax-section-header
      index="03"
      titleId="projects-title"
      [label]="'PROJECTS.LABEL' | transloco"
      [title]="'PROJECTS.TITLE' | transloco"
      [lead]="'PROJECTS.LEAD' | transloco" />

    <div class="track__grid" axReveal [revealStagger]="0.1" revealStart="top 85%">
      @for (project of projects; track project.title) {
        <tech-stack-case-study-card data-reveal-item [data]="project" (projectOpened)="openProjectModal($event)" />
      }
    </div>
  </div>
</section>
