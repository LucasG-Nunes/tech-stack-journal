<a class="skip-link" href="#main-content">{{ 'NAV.SKIP' | transloco }}</a>

<header class="ax-header" [class.is-scrolled]="scrolled()" [class.is-open]="menuOpen()">
  <div class="ax-header__inner">
    <!-- Marca -->
    <a class="brand" routerLink="/" (click)="closeMenu()" [attr.aria-label]="'HEADER.HOME_ARIA' | transloco">
      <span class="brand__mark" aria-hidden="true">LN</span>
      <span class="brand__text">
        <span class="brand__name">{{ 'HEADER.NAME' | transloco }}</span>
        <span class="brand__role">{{ 'HEADER.ROLE' | transloco }}</span>
      </span>
    </a>

    <!-- Navegação -->
    <nav id="main-nav" class="nav" [attr.aria-label]="'NAV.MAIN_ARIA' | transloco">
      <ul class="nav__list">
        @for (anchor of anchors; track anchor.id; let i = $index) {
          <li>
            <a
              class="nav__link"
              routerLink="/"
              [fragment]="anchor.id"
              [class.is-active]="activeSection() === anchor.id"
              [attr.aria-current]="activeSection() === anchor.id ? 'location' : null">
              <span class="nav__index" aria-hidden="true">0{{ i + 1 }}</span>
              {{ anchor.label | transloco }}
            </a>
          </li>
        }
        <li>
          <a class="nav__link" routerLink="/blog" routerLinkActive="is-active" ariaCurrentWhenActive="page">
            <span class="nav__index" aria-hidden="true">//</span>
            {{ 'NAV.BLOG' | transloco }}
          </a>
        </li>
      </ul>
    </nav>

    <!-- Ações -->
    <div class="actions">
      <button
        type="button"
        class="lang"
        (click)="toggleLanguage()"
        [attr.aria-label]="'NAV.LANG_ARIA' | transloco">
        <span [class.is-on]="activeLang === 'pt-br'">PT</span>
        <span class="lang__sep" aria-hidden="true">/</span>
        <span [class.is-on]="activeLang === 'en-us'">EN</span>
      </button>

      <a class="cta" routerLink="/" fragment="contact">{{ 'NAV.CONTACT' | transloco }}</a>

      <button
        type="button"
        class="burger"
        (click)="toggleMenu()"
        aria-controls="main-nav"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="(menuOpen() ? 'NAV.MENU_CLOSE' : 'NAV.MENU_OPEN') | transloco">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
